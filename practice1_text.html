<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>practice1_text</title>
</head> 
<body>
    <h2>실습 1: 제목 글자 변경</h2>
    <h1 id="title1">처음 제목입니다.</h1>
    <button id="changeButton">제목 바꾸기</button>
    <script>    
        let title1 = document.getElementById("title1");
        let changeButton = document.getElementById("changeButton");

        changeButton.onclick = function () {
            title1.textContent = "JavaScript로 제목을 바꿨습니다.";
        };
    </script>
</body>
</html>
