<!DOCTYPE html>
<html>
    <head>
        <title>practice2_style</title>
    </head>
    <body>
        <h2>실습 2: 스타일 변경</h2>
    <h1 id="title">스타일 변경 예제</h1>
    <button id="styleButton">스타일 바꾸기</button>
    
    <script>
        let title2 = document.getElementById("title");
        let styleButton = document.getElementById("styleButton");

        styleButton.onclick = function () {
            title2.style.color = "white";
            title2.style.backgroundColor = "blue";
            title2.style.padding = "10px";
        };
    </script>
</body>
</html>
